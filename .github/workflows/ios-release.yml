name: "iOS Release (App Store Connect)"

# Compila, firma y sube el build a App Store Connect (TestFlight / revision).
# Ejecutar a mano: GitHub -> Actions -> "iOS Release" -> Run workflow.
# Requiere estos Secrets en Settings -> Secrets and variables -> Actions:
#   ASC_KEY_ID       Key ID de la clave API de App Store Connect
#   ASC_ISSUER_ID    Issuer ID (Usuarios y acceso -> Integraciones)
#   ASC_KEY_P8       Contenido COMPLETO del archivo AuthKey_XXXX.p8
#   APPLE_TEAM_ID    Team ID de la cuenta de ORGANIZACION

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.1"
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Compilar Flutter (sin firmar)
        run: flutter build ios --release --no-codesign

      - name: Clave API de App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO archive

      - name: Firmar y subir a App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>$TEAM</string>
          <key>signingStyle</key><string>automatic</string>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"

      - name: Limpiar clave
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
